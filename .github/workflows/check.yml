name: Check
on:
  # Strict PR protection requires current main plus check/visual before merge.
  # Do not repeat the same acceptance suite on the resulting main push.
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      financial: ${{ steps.filter.outputs.financial }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: node scripts/affected.mjs "${{ github.event.pull_request.base.sha }}"
  check:
    needs: changes
    defaults:
      run:
        working-directory: apps/financial
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Financial unchanged
        if: needs.changes.outputs.financial != 'true'
        working-directory: .
        run: echo 'No financial changes to check'
      - uses: actions/checkout@v4
        if: needs.changes.outputs.financial == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.financial == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.financial == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.financial == 'true'
      - run: pnpm test:ci-tools
        if: needs.changes.outputs.financial == 'true'
      - name: Check page coverage inventory
        if: needs.changes.outputs.financial == 'true'
        run: pnpm check:visual-coverage
      - run: pnpm typecheck
        if: needs.changes.outputs.financial == 'true'
      - run: pnpm test:coverage
        if: needs.changes.outputs.financial == 'true'
      - run: pnpm build
        if: needs.changes.outputs.financial == 'true'
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.financial == 'true'
        with:
          name: production-build
          path: apps/financial/dist/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && needs.changes.outputs.financial == 'true'
        with:
          name: coverage
          path: apps/financial/coverage/
          retention-days: 14
  visual:
    needs: changes
    defaults:
      run:
        working-directory: apps/financial
    name: visual
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/hasbai/financial-visual-ci@sha256:4aca1416fa6743042754ec8aaac4a68239f25e89e4535c5f152c2b4a6c03ce4b
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - name: Financial unchanged
        if: needs.changes.outputs.financial != 'true'
        working-directory: .
        run: echo 'No financial visual changes to check'
      - uses: actions/checkout@v4
        if: needs.changes.outputs.financial == 'true'
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.financial == 'true'
      - run: test "$(pnpm exec playwright --version)" = 'Version 1.63.0'
        if: needs.changes.outputs.financial == 'true'
      - run: pnpm build
        if: needs.changes.outputs.financial == 'true'
      - run: pnpm exec vite build --mode e2e
        if: needs.changes.outputs.financial == 'true'
        env:
          VITE_DATA_API_URL: http://127.0.0.1:4173/test-api
      - run: node scripts/prepare-browser-build.mjs
        if: needs.changes.outputs.financial == 'true'
      - if: needs.changes.outputs.financial == 'true'
        run: pnpm test:e2e
        env:
          VISUAL_COVERAGE_GATE: '1'
      - uses: actions/upload-artifact@v4
        if: always() && needs.changes.outputs.financial == 'true'
        with:
          name: playwright-results
          path: |
            apps/financial/playwright-report/
            apps/financial/test-results/
          retention-days: 14
