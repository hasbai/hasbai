name: Build visual CI image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    name: build-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64: default for CI visual jobs and local development (Apple Silicon).
          - arch: arm64
            runner: ubuntu-24.04-arm
          # amd64: cloud environment only (scripts/cloud-dev.mjs).
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: docker/visual-ci/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/hasbai/financial-visual-ci:chromium-pw1.63.0-node24-pnpm10.33.2-${{ matrix.arch }}-v1
      - run: echo "${{ matrix.arch }} image digest ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
