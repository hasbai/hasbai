name: Blog
on:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    name: blog-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/blog
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node ../financial/scripts/check-visual-coverage.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: blog-production
          path: apps/blog/.svelte-kit/cloudflare/
  visual:
    name: blog-visual
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/hasbai/financial-visual-ci@sha256:cc48be4b60948d04c091d95e32ab0c2a2ec1393b778fa39bf69cedd4d94dd579
      options: --ipc=host
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/blog
    steps:
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile
      - run: test "$(pnpm exec playwright --version)" = 'Version 1.63.0'
      - run: pnpm build
      - run: pnpm exec vite build --mode e2e
        env:
          VISUAL_COVERAGE_GATE: '1'
          DEBUG: pw:webserver
          PUBLIC_DATA_API_URL: http://127.0.0.1:4180/rest/v1
          PUBLIC_ANONYMOUS_AUTH_URL: http://127.0.0.1:4180/auth
      - run: pnpm test:e2e
        env:
          VISUAL_COVERAGE_GATE: '1'
          DEBUG: pw:webserver
          PUBLIC_DATA_API_URL: http://127.0.0.1:4180/rest/v1
          PUBLIC_ANONYMOUS_AUTH_URL: http://127.0.0.1:4180/auth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blog-playwright-results
          path: |
            apps/blog/test-results/
            apps/blog/playwright-report/
