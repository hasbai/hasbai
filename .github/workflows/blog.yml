name: Blog
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      blog: ${{ steps.filter.outputs.blog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: node scripts/affected.mjs "${{ github.event.pull_request.base.sha }}"
  check:
    name: blog-check
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/blog
    steps:
      - name: Blog unchanged
        if: needs.changes.outputs.blog != 'true'
        working-directory: .
        run: echo 'No blog changes to check'
      - uses: actions/checkout@v4
        if: needs.changes.outputs.blog == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.blog == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.blog == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.blog == 'true'
      - run: node ../financial/scripts/check-visual-coverage.mjs
        if: needs.changes.outputs.blog == 'true'
      - run: pnpm typecheck
        if: needs.changes.outputs.blog == 'true'
      - run: pnpm test
        if: needs.changes.outputs.blog == 'true'
      - run: pnpm build
        if: needs.changes.outputs.blog == 'true'
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.blog == 'true'
        with:
          name: blog-production
          path: apps/blog/.svelte-kit/cloudflare/
  visual:
    name: blog-visual
    needs: changes
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/hasbai/financial-visual-ci@sha256:4aca1416fa6743042754ec8aaac4a68239f25e89e4535c5f152c2b4a6c03ce4b
      options: --ipc=host
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/blog
    steps:
      - name: Blog unchanged
        if: needs.changes.outputs.blog != 'true'
        working-directory: .
        run: echo 'No blog visual changes to check'
      - uses: actions/checkout@v4
        if: needs.changes.outputs.blog == 'true'
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.blog == 'true'
      - run: test "$(pnpm exec playwright --version)" = 'Version 1.63.0'
        if: needs.changes.outputs.blog == 'true'
      - run: pnpm build
        if: needs.changes.outputs.blog == 'true'
      - run: pnpm exec vite build --mode e2e
        if: needs.changes.outputs.blog == 'true'
        env:
          VISUAL_COVERAGE_GATE: '1'
          DEBUG: pw:webserver
          PUBLIC_DATA_API_URL: http://127.0.0.1:4180/rest/v1
          PUBLIC_ANONYMOUS_AUTH_URL: http://127.0.0.1:4180/auth
      - run: pnpm test:e2e
        if: needs.changes.outputs.blog == 'true'
        env:
          VISUAL_COVERAGE_GATE: '1'
          DEBUG: pw:webserver
          PUBLIC_DATA_API_URL: http://127.0.0.1:4180/rest/v1
          PUBLIC_ANONYMOUS_AUTH_URL: http://127.0.0.1:4180/auth
      - uses: actions/upload-artifact@v4
        if: always() && needs.changes.outputs.blog == 'true'
        with:
          name: blog-playwright-results
          path: |
            apps/blog/test-results/
            apps/blog/playwright-report/
