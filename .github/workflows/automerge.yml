name: Auto-merge
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review]
permissions:
  contents: write
  pull-requests: write
jobs:
  enable:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      # pull_request_target runs this file from main. Never check out PR code here.
      # GitHub squash-merges once the required `Hasbai CI` check passes. A Draft PR stays unmerged.
      - run: gh pr merge "$PR" --auto --squash --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
