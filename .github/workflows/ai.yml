name: AI
on:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    name: ai-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:visual-coverage
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:runtime
      - run: pnpm build
  visual:
    name: ai-visual
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/hasbai/financial-visual-ci@sha256:cc48be4b60948d04c091d95e32ab0c2a2ec1393b778fa39bf69cedd4d94dd579
      options: --ipc=host
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec vite build --mode e2e
      - run: node ../financial/scripts/prepare-browser-build.mjs
      - run: pnpm test:e2e
        env:
          VISUAL_COVERAGE_GATE: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-browser-results
          path: apps/ai/test-results/
