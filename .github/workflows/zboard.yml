name: Zboard
on:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    name: zboard-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/zboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node ../financial/scripts/check-visual-coverage.mjs
      - run: pnpm typecheck
      - run: pnpm exec wrangler d1 migrations apply zboard --local
      - name: Install pinned Mihomo for subscription compatibility
        run: |
          curl --fail --location --retry 2 --max-time 120 https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-v1.19.32.gz -o "$RUNNER_TEMP/mihomo.gz"
          echo "8451100836c9eda194331c2babfad490b2faf30cebc1a04b0e76fd8ac2d35d10  $RUNNER_TEMP/mihomo.gz" | sha256sum --check
          gunzip "$RUNNER_TEMP/mihomo.gz"
          chmod +x "$RUNNER_TEMP/mihomo"
      - run: pnpm test
        env:
          MIHOMO_BIN: ${{ runner.temp }}/mihomo
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: zboard-production
          path: apps/zboard/dist/
  visual:
    name: zboard-visual
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/hasbai/financial-visual-ci@sha256:4aca1416fa6743042754ec8aaac4a68239f25e89e4535c5f152c2b4a6c03ce4b
      options: --ipc=host
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/zboard
    steps:
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile
      - run: test "$(pnpm exec playwright --version)" = 'Version 1.63.0'
      - run: pnpm build
      - run: pnpm exec vite build --mode e2e
        env:
          VISUAL_COVERAGE_GATE: "1"
          DEBUG: pw:webserver
      - run: node ../financial/scripts/prepare-browser-build.mjs
      - run: pnpm test:e2e
        env:
          VISUAL_COVERAGE_GATE: "1"
          DEBUG: pw:webserver
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zboard-playwright-results
          path: |
            apps/zboard/test-results/
            apps/zboard/playwright-report/
