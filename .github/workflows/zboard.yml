name: Zboard
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zboard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      zboard: ${{ steps.filter.outputs.zboard }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: node scripts/affected.mjs "${{ github.event.pull_request.base.sha }}"
  check:
    name: zboard-check
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/zboard
    steps:
      - name: Zboard unchanged
        if: needs.changes.outputs.zboard != 'true'
        working-directory: .
        run: echo 'No zboard changes to check'
      - uses: actions/checkout@v4
        if: needs.changes.outputs.zboard == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.zboard == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.zboard == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.zboard == 'true'
      - run: node ../financial/scripts/check-visual-coverage.mjs
        if: needs.changes.outputs.zboard == 'true'
      - run: pnpm typecheck
        if: needs.changes.outputs.zboard == 'true'
      - run: pnpm exec wrangler d1 migrations apply zboard --local
        if: needs.changes.outputs.zboard == 'true'
      - name: Install pinned Mihomo for subscription compatibility
        if: needs.changes.outputs.zboard == 'true'
        run: |
          curl --fail --location --retry 2 --max-time 120 https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-v1.19.32.gz -o "$RUNNER_TEMP/mihomo.gz"
          echo "8451100836c9eda194331c2babfad490b2faf30cebc1a04b0e76fd8ac2d35d10  $RUNNER_TEMP/mihomo.gz" | sha256sum --check
          gunzip "$RUNNER_TEMP/mihomo.gz"
          chmod +x "$RUNNER_TEMP/mihomo"
      - run: pnpm test
        if: needs.changes.outputs.zboard == 'true'
        env:
          MIHOMO_BIN: ${{ runner.temp }}/mihomo
      - run: pnpm build
        if: needs.changes.outputs.zboard == 'true'
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.zboard == 'true'
        with:
          name: zboard-production
          path: apps/zboard/dist/
  visual:
    name: zboard-visual
    needs: changes
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/hasbai/financial-visual-ci@sha256:4aca1416fa6743042754ec8aaac4a68239f25e89e4535c5f152c2b4a6c03ce4b
      options: --ipc=host
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/zboard
    steps:
      - name: Zboard unchanged
        if: needs.changes.outputs.zboard != 'true'
        working-directory: .
        run: echo 'No zboard visual changes to check'
      - uses: actions/checkout@v4
        if: needs.changes.outputs.zboard == 'true'
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.zboard == 'true'
      - run: test "$(pnpm exec playwright --version)" = 'Version 1.63.0'
        if: needs.changes.outputs.zboard == 'true'
      - run: pnpm build
        if: needs.changes.outputs.zboard == 'true'
      - run: pnpm exec vite build --mode e2e
        if: needs.changes.outputs.zboard == 'true'
        env:
          VISUAL_COVERAGE_GATE: "1"
          DEBUG: pw:webserver
      - run: node ../financial/scripts/prepare-browser-build.mjs
        if: needs.changes.outputs.zboard == 'true'
      - run: pnpm test:e2e
        if: needs.changes.outputs.zboard == 'true'
        env:
          VISUAL_COVERAGE_GATE: "1"
          DEBUG: pw:webserver
      - uses: actions/upload-artifact@v4
        if: always() && needs.changes.outputs.zboard == 'true'
        with:
          name: zboard-playwright-results
          path: |
            apps/zboard/test-results/
            apps/zboard/playwright-report/
