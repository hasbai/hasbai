name: Tavern
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tavern-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      tavern: ${{ steps.filter.outputs.tavern }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: node scripts/affected.mjs "${{ github.event.pull_request.base.sha }}"
  check:
    name: tavern-check
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/tavern
    steps:
      - name: Tavern unchanged
        if: needs.changes.outputs.tavern != 'true'
        working-directory: .
        run: echo 'No tavern changes to check'
      - uses: actions/checkout@v4
        if: needs.changes.outputs.tavern == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.tavern == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.tavern == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.tavern == 'true'
      - run: node ../financial/scripts/check-visual-coverage.mjs
        if: needs.changes.outputs.tavern == 'true'
      - run: pnpm typecheck
        if: needs.changes.outputs.tavern == 'true'
      - run: pnpm exec wrangler d1 migrations apply tavern --local
        if: needs.changes.outputs.tavern == 'true'
      - run: pnpm test
        if: needs.changes.outputs.tavern == 'true'
      - run: pnpm test:session-runtime
        if: needs.changes.outputs.tavern == 'true'
      - run: pnpm build
        if: needs.changes.outputs.tavern == 'true'
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.tavern == 'true'
        with:
          name: tavern-production
          path: apps/tavern/dist/
  visual:
    name: tavern-visual
    needs: changes
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/hasbai/financial-visual-ci@sha256:4aca1416fa6743042754ec8aaac4a68239f25e89e4535c5f152c2b4a6c03ce4b
      options: --ipc=host
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/tavern
    steps:
      - name: Tavern unchanged
        if: needs.changes.outputs.tavern != 'true'
        working-directory: .
        run: echo 'No tavern visual changes to check'
      - uses: actions/checkout@v4
        if: needs.changes.outputs.tavern == 'true'
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.tavern == 'true'
      - run: test "$(pnpm exec playwright --version)" = 'Version 1.63.0'
        if: needs.changes.outputs.tavern == 'true'
      - run: pnpm build
        if: needs.changes.outputs.tavern == 'true'
      - run: pnpm exec vite build --mode e2e
        if: needs.changes.outputs.tavern == 'true'
        env:
          VISUAL_COVERAGE_GATE: "1"
          DEBUG: pw:webserver
      - run: node ../financial/scripts/prepare-browser-build.mjs
        if: needs.changes.outputs.tavern == 'true'
      - run: pnpm test:e2e
        if: needs.changes.outputs.tavern == 'true'
        env:
          VISUAL_COVERAGE_GATE: "1"
          DEBUG: pw:webserver
      - uses: actions/upload-artifact@v4
        if: always() && needs.changes.outputs.tavern == 'true'
        with:
          name: tavern-playwright-results
          path: |
            apps/tavern/test-results/
            apps/tavern/playwright-report/
