name: WeChat
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wechat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      wechat: ${{ steps.filter.outputs.wechat }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: node scripts/affected.mjs "${{ github.event.pull_request.base.sha }}"
  check:
    name: wechat-check
    needs: changes
    if: needs.changes.outputs.wechat == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/wechat
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:runtime
      - run: pnpm build
