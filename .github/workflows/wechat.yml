name: WeChat
on:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    name: wechat-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/wechat
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:runtime
      - run: pnpm build
